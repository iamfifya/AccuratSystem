name: ДаЭтоЖе System CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # === RESTORE PHASE ===
      - name: Restore legacy packages (packages.config)
        run: nuget restore DaEtoZhe.Desktop\DaEtoZhe.Desktop.csproj -PackagesDirectory packages

      - name: Fix broken CSPROJ paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path DaEtoZhe.Desktop\packages
          Copy-Item -Path packages\* -Destination DaEtoZhe.Desktop\packages -Recurse -Force

      - name: Restore modern packages (Desktop)
        run: dotnet restore DaEtoZhe.Desktop\DaEtoZhe.Desktop.csproj

      - name: Restore modern packages (API)
        run: dotnet restore DaEtoZhe.WebAPI\DaEtoZhe.WebAPI.csproj

      # === BUILD PHASE ===
      - name: Build Desktop Client
        run: dotnet build DaEtoZhe.Desktop\DaEtoZhe.Desktop.csproj --configuration ${{ matrix.configuration }} --no-restore

      - name: Build Web API
        run: dotnet build DaEtoZhe.WebAPI\DaEtoZhe.WebAPI.csproj --configuration ${{ matrix.configuration }} --no-restore

      # === ARTIFACTS ===
      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaEtoZhe-Desktop-${{ matrix.configuration }}
          path: DaEtoZhe.Desktop\bin\${{ matrix.configuration }}\net10.0-windows\
          retention-days: 14
          if-no-files-found: error

      - name: Upload API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaEtoZhe-API-${{ matrix.configuration }}
          path: DaEtoZhe.WebAPI\bin\${{ matrix.configuration }}\net10.0\
          retention-days: 14
          if-no-files-found: error