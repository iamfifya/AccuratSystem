name: Accurat System CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'  # ← возвращаем 10.0.x, твой проект на .NET 10

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore legacy packages (packages.config)
        run: nuget restore AccuratPanelCarWashing\AccuratPanelCarWashing.csproj -PackagesDirectory packages

      - name: Fix broken CSPROJ paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path AccuratPanelCarWashing\packages
          Copy-Item -Path packages\* -Destination AccuratPanelCarWashing\packages -Recurse -Force

      - name: Restore modern packages (PackageReference)
        run: dotnet restore AccuratPanelCWD\AccuratPanelCWD.csproj

      - name: Build WPF Client
        run: dotnet build AccuratPanelCWD\AccuratPanelCWD.csproj --configuration ${{ matrix.configuration }} --no-restore

      - name: Restore Web API
        run: dotnet restore Accurat.WebAPI\Accurat.WebAPI.csproj

      - name: Build Web API
        run: dotnet build Accurat.WebAPI\Accurat.WebAPI.csproj --configuration ${{ matrix.configuration }} --no-restore

      - name: Restore WPF Client
        run: dotnet restore AccuratPanelCWD\AccuratPanelCWD.csproj

      - name: Build WPF Client
        run: dotnet build AccuratPanelCWD\AccuratPanelCWD.csproj --configuration ${{ matrix.configuration }} --no-restore

      - name: Upload WPF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Accurat-Client-Release
          path: AccuratPanelCWD\bin\${{ matrix.configuration }}\
          retention-days: 14
