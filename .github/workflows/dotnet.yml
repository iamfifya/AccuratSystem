name: Accurat System CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'  # ← замени на '10.0.x' если используешь .NET 10 Preview

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup .NET SDK (для nuget restore)
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages (WPF)
      run: nuget restore AccuratPanelCarWashing\AccuratPanelCarWashing.csproj -PackagesDirectory packages

    - name: Fix broken CSPROJ paths
      run: |
        New-Item -ItemType Directory -Force -Path AccuratPanelCarWashing\packages
        Copy-Item -Path packages\* -Destination AccuratPanelCarWashing\packages -Recurse -Force

    - name: Restore .NET Packages (API)
      run: dotnet restore Accurat.WebAPI\Accurat.WebAPI.csproj

    - name: Build Web API
      run: dotnet build Accurat.WebAPI\Accurat.WebAPI.csproj --configuration ${{ matrix.configuration }} --no-restore

    - name: Build WPF Client
      run: msbuild AccuratPanelCWD\AccuratPanelCWD.csproj /p:Configuration=${{ matrix.configuration }}

    - name: Upload WPF Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Accurat-Client-Release
        path: AccuratPanelCarWashing\bin\${{ matrix.configuration }}\
        retention-days: 14